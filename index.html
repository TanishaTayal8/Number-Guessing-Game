<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }
        /* Particle Background */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientAnimation 10s ease infinite;
            z-index: -1;
        }
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .game-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            padding: 30px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            animation: fadeIn 1.5s ease;
            z-index: 1;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        h1 {
            font-size: 26px;
            color: #4a1456;
            margin-bottom: 15px;
        }
        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        input {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #a97de0;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #5e3b76;
        }
        button {
            width: 40%;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 5px;
            margin: 10px 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        .guess-btn {
            background-color: #5e3b76;
        }
        .reset-btn {
            background-color: #b85555;
        }
        .message {
            font-size: 18px;
            color: #4a1456;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .message.correct {
            background-color: #c8e6c9;
            color: #2e7d32;
        }
        .message.higher {
            background-color: #fff3e0;
            color: #f57c00;
        }
        .message.lower {
            background-color: #ffebee;
            color: #c62828;
        }
    </style>
    <!-- Load particles.js library -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
    <!-- Particle Background Container -->
    <div id="particles-js"></div>

    <div class="game-container">
        <h1>🎉 Number Guessing Game 🎉</h1>
        <p>Guess a number between 1 and 100:</p>
        <input type="number" id="guessInput" min="1" max="100" placeholder="Enter your guess..." />
        <button class="guess-btn" onclick="makeGuess()">Guess</button>
        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
        <p class="message" id="message">Let's start the game!</p>
    </div>

    <script>
        let targetNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function makeGuess() {
            const userGuess = parseInt(document.getElementById('guessInput').value);
            attempts++;

            const messageElement = document.getElementById('message');
            messageElement.classList.remove('correct', 'higher', 'lower');

            if (isNaN(userGuess)) {
                messageElement.innerText = "Please enter a valid number!";
                messageElement.classList.add('lower');
                return;
            }

            if (userGuess < targetNumber) {
                messageElement.innerText = `Too low! Try a higher number. Attempts: ${attempts}`;
                messageElement.classList.add('higher');
            } else if (userGuess > targetNumber) {
                messageElement.innerText = `Too high! Try a lower number. Attempts: ${attempts}`;
                messageElement.classList.add('lower');
            } else {
                messageElement.innerText = `🎉 Congratulations! You guessed it in ${attempts} attempts. 🎉`;
                messageElement.classList.add('correct');
            }
        }

        function resetGame() {
            targetNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            const messageElement = document.getElementById('message');
            messageElement.innerText = "Game has been reset! Try guessing again.";
            messageElement.className = 'message';
            document.getElementById('guessInput').value = '';
        }

        // Initialize particles.js background
        particlesJS('particles-js', {
            particles: {
                number: { value: 100 },
                color: { value: ["#ff9a9e", "#fad0c4", "#fbc2eb", "#a97de0"] },
                shape: { type: "circle" },
                opacity: { value: 0.7 },
                size: { value: 4 },
                line_linked: {
                    enable: true,
                    color: "#ffffff",
                    opacity: 0.3,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1.5,
                    direction: "none",
                    out_mode: "out"
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "repulse" },
                    onclick: { enable: true, mode: "push" },
                    resize: true
                }
            }
        });
    </script>
</body>
</html>
